name: Foundry CI

# First CI for this repo (#73). GitHub-hosted ubuntu-latest on purpose — must not
# depend on the self-hosted Mac fleet being awake.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  constitution-tiering:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax-check ALL shell executables
        run: |
          for f in bin/*.sh bin/lib/*.sh bin/__tests__/*.sh; do
            echo "bash -n $f"; bash -n "$f"
          done
      - name: Syntax-check python
        run: python3 -m py_compile bin/crucible.py
      - name: Constitution tiering unit tests
        run: bash bin/__tests__/constitution-tiering.test.sh
      - name: Orchestrator dry-run smoke test (engine coverage)
        run: bash bin/__tests__/foundry-dryrun.test.sh
